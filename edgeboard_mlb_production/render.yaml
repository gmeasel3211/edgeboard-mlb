services:
  - type: web
    name: edgeboard-mlb
    runtime: docker
    plan: starter
    region: ohio
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: edgeboard-mlb-db
          property: connectionString
      - fromGroup: edgeboard-mlb-data
      - key: CRON_SECRET
        generateValue: true
      - key: SITE_PASSWORD
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: TIMEZONE
        value: America/New_York
      - key: DEMO_MODE
        value: false
      - key: RUN_INTERNAL_SCHEDULER
        value: false
      - key: REFRESH_ON_STARTUP
        value: false
      - key: PYTHON_VERSION
        value: 3.12.11

  - type: cron
    name: edgeboard-mlb-refresh
    runtime: docker
    plan: starter
    region: ohio
    schedule: '*/30 * * * *'
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m app.worker_refresh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: edgeboard-mlb-db
          property: connectionString
      - fromGroup: edgeboard-mlb-data
      - key: ENVIRONMENT
        value: production
      - key: TIMEZONE
        value: America/New_York
      - key: DEMO_MODE
        value: false
      - key: RUN_INTERNAL_SCHEDULER
        value: false
      - key: REFRESH_ON_STARTUP
        value: false
      - key: PYTHON_VERSION
        value: 3.12.11

databases:
  - name: edgeboard-mlb-db
    plan: basic-256mb
    region: ohio
    databaseName: edgeboard
    user: edgeboard
    postgresMajorVersion: '18'
    ipAllowList: []

envVarGroups:
  - name: edgeboard-mlb-data
    envVars:
      - key: ODDS_API_KEY
        sync: false
